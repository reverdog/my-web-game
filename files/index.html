<style>
:root{--bg:#0b0b14;--fg:#e8e8f4;--mut:#9a9ab8;--pn:#15152a;--ac:#8b7bff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0}

</style></head><body>
<canvas id="c"></canvas>
<div id="ov"><div id="pn"><h2 id="h"></h2><p id="s"></p><div id="bx"></div></div></div>
<script>
const VER='0.9.0',RK='jhr',MOB=true,U=MOB?1.4:1;
const $=i=>document.getElementById(i),cv=$('c'),X=cv.getContext('2d'),ov=$('ov'),R=Math.random,TAU=Math.PI*2;
const pk=a=>a[R()*a.length|0],rn=(a,b)=>a+R()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const RO=['','Ⅰ','Ⅱ','Ⅲ'],ids=['fire','elec','split','time','dark'];
const shuf=a=>a.map(v=>[R(),v]).sort((p,q)=>p[0]-q[0]).map(v=>v[1]);
const mmss=t=>(t/60|0)+':'+('0'+(t%60|0)).slice(-2);
const E={
fire:['화염','#ff6a3d','적중 지점에 화염이 남는다','화염 범위·지속 증가','소멸 시 폭발'],
elec:['번개','#5ad6ff','적중 시 1회 연쇄','연쇄 2회·피해 증가','연쇄 4회 + 감전 둔화'],
split:['분열','#7dff9a','적중 시 2갈래 분열','분열체 피해 증가','분열체 3개 + 관통'],
time:['시간','#ffd45a','0.7초 뒤 같은 탄 재출현','재출현 피해 증가','재출현 2회'],
dark:['암흑','#b07bff','관통 2','관통 4','관통 6 + 귀환'],
plasma:['플라즈마','#ff5ad1','화염+번개: 적중 시 폭발과 3연쇄'],
rift:['공허 귀환','#9aa7ff','암흑+시간: 무한 관통·귀환·재출현']};
const RC=[['fire','elec','plasma'],['dark','time','rift'],['split','time','mirror']];
E.mirror=['거울 분신','#9ad0ff','분열+시간: 후방에도 사격'];
const SC=[['storm','폭풍 Core','elec',3,'split',2],['inferno','화염 심판 Core','fire',3,'dark',2]];
const DX=[['plasma','플라즈마','화염Ⅱ + 번개Ⅱ'],['rift','공허 귀환','암흑Ⅱ + 시간Ⅱ'],['mirror','거울 분신','분열 + ???'],['storm','폭풍 Core','Core Ⅲ + 번개Ⅲ + 분열Ⅱ'],['inferno','화염 심판 Core','Core Ⅲ + 화염Ⅲ + 암흑Ⅱ'],['aw0','태양 각성','Core Ⅲ + 전용 화염Ⅲ'],['aw1','뇌속 각성','Core Ⅲ + 전용 번개Ⅲ'],['aw2','불멸 각성','Core Ⅲ + 전용 암흑Ⅲ'],['aw3','시간 각성','Core Ⅲ + 전용 시간Ⅲ'],['aw4','분열 각성','Core Ⅲ + 전용 분열Ⅲ']];
const CH=[
{n:'공격형',d:'공격력 높음 · 이동 느림',hp:90,sp:135,dm:1.3,as:1,e:'fire'},
{n:'이동형',d:'이동·공격 속도 높음',hp:85,sp:185,dm:1,as:1.15,e:'elec'},
{n:'생존형',d:'체력 높음 · 공격력 낮음',hp:150,sp:150,dm:.85,as:1,e:'dark'}];
const RU=[
{n:'군집',gr:'s',u:1,d:'적 생성 +30%, 경험치 +10%',f:()=>{g.sm*=1.3;g.xm*=1.1}},
{n:'질주',gr:'v',u:1,d:'적 이동 +20%, 경험치 +25%',f:()=>{g.es*=1.2;g.xm*=1.25}},
{n:'풍요',gr:'g',u:1,d:'재화 +50%, 상점 3회',f:()=>{g.gm*=1.5;g.shops=3}},
{n:'정예 시즌',gr:'e',u:1,d:'엘리트가 더 자주 등장',f:()=>{g.em*=.6}},
{n:'소수 정예',gr:'s',u:2,d:'적 생성 −30%, 적 체력 +50%, 경험치 +30%',f:()=>{g.sm*=.7;g.hm*=1.5;g.xm*=1.3}},
{n:'잔향의 폭풍',gr:'d',u:3,d:'잔향 드롭 ×2.5, 적 이동 +10%',f:()=>{g.dr*=2.5;g.es*=1.1}},
{n:'속사 시대',gr:'a',u:4,d:'공격 속도 +20%, 최대 HP −20%',f:()=>{g.as*=1.2;g.mhp*=.8;g.hp=g.mhp}},
{n:'황금 비',gr:'g',u:5,d:'재화 ×2, 적 체력 +20%',f:()=>{g.gm*=2;g.hm*=1.2}},
{n:'엘리트 사냥',gr:'e',u:6,d:'엘리트가 매우 자주 등장',f:()=>{g.em*=.4}}];
CH.push({n:'시간술사',d:'공격 속도 높음 · 시간 잔향 시작',hp:100,sp:150,dm:1,as:1.15,e:'time',u:'계정 Lv 3 달성',ul:3},
{n:'분열자',d:'균형형 · 분열 잔향 시작',hp:105,sp:150,dm:1.1,as:1.05,e:'split',u:'영구 재화 150으로 구매',cost:150});
const GO=[['보스','최종 보스 처치'],['최종 웨이브','최종 웨이브 40초 생존']];
let W=0,H=0,TL=300,g,RL,k={},tv=null,jo=null,jid=-1,md=0,mx=0,my=0,Qa=[],cur=0,M={g:0,u:[0,0,0,0,0]};
try{M=JSON.parse(localStorage.getItem('jh'))||M}catch(e){}
M.dx=M.dx||[];M.uc=M.uc||[];M.ac=M.ac||[];M.ax=M.ax||0;let HD=0,TM=0;
function AL(){let l=1,x=M.ax;while(x>=120+60*l){x-=120+60*l;l++}return[l,x,120+60*l]}
const ok=i=>TM||!CH[i].u||(CH[i].ul?AL()[0]>=CH[i].ul:M.uc.includes(i));
function pickR(){let L=TM?99:AL()[0],o=[],gs=new Set;for(const q of shuf(RU.filter(q=>q.u<=L))){if(gs.has(q.gr))continue;gs.add(q.gr);o.push(q);if(o.length==2)break}return o}
const sv=()=>{try{localStorage.setItem('jh',JSON.stringify(M))}catch(e){}};
const K=(...n)=>n.some(a=>k[a])?1:0;

/* ---------- 대화창 큐 ---------- */
function ask(t,s,o){Qa.push([t,s,o]);if(!cur)nx()}
function nx(){let a=Qa.shift();if(!a){cur=0;ov.hidden=true;return}cur=1;ov.hidden=false;$('h').textContent=a[0];$('s').innerHTML=a[1];let bx=$('bx');bx.innerHTML='';a[2].forEach(o=>{let b=document.createElement('button');b.innerHTML=o.t;b.onclick=()=>{o.f();nx()};bx.append(b)})}
const toast=s=>{g.toast=[s,3]};

/* ---------- 런 시작 / 종료 ---------- */
function newG(i){let c=CH[i],u=M.u;g={t:0,k:0,gold:0,xp:0,lv:1,need:24,mhp:c.hp+8*u[0],x:0,y:0,fa:0,sp:c.sp*(1+.03*u[3]),dm:c.dm*(1+.04*u[1]+.01*M.dx.length),as:c.as*(1+.03*u[2]),cr:.05+.01*u[4],inv:0,rv:1,cd:.4,st:'menu',goal:0,ch:0,hm:1,dx:1,rw:1,dr:.012,pt:2,sc:null,aw:0,bn:0,won:0,sm:1,xm:600/TL,es:1,gm:1,em:1,shops:2,sh:0,ev:0,elT:TL/7,fin:0,boss:null,spA:0,f1:0,hint:'fire',toast:null,en:[],pr:[],eb:[],zn:[],fx:[],pa:[],Q:[],sl:[{id:c.e,lv:1,lock:1},null,null,null,null]};g.hp=g.mhp}
function menu(keep){let sr=null;try{sr=JSON.parse(localStorage.getItem(RK))}catch(e){}if(!keep)RL={goal:R()<.5?0:1,rules:pickR(),hint:pk(ids)};
ask('잔향','계정 Lv '+AL()[0]+' ('+AL()[1]+'/'+AL()[2]+' XP)<br><b>이번 런 규칙</b><br>목표: '+GO[RL.goal][1]+'<br>'+RL.rules.map(r=>r.n+' — '+r.d).join('<br>')+'<br>규칙 해금: '+RU.filter(q=>q.u>1).map(q=>'Lv'+q.u+' '+q.n).join(' · ')+'<br>힌트: '+E[RL.hint][0]+' 계열과 궁합이 좋습니다<br>특수 Core(Lv10~): 폭풍 = 번개Ⅲ+분열Ⅱ · 화염 심판 = 화염Ⅲ+암흑Ⅱ<br><br>WASD·방향키로 이동하면 공격은 자동으로 이동 방향에 나갑니다. 마우스를 누르면 그쪽으로 조준하고, 모바일은 화면을 드래그하세요.<br>버전 v'+VER,
(sr&&!TM?[{t:'▶ <b>이어하기</b> — '+CH[sr.g.ch].n+' · Lv '+sr.g.lv+' · '+mmss(sr.g.t),f:resume}]:[]).concat(CH.map((c,i)=>ok(i)?{t:`<b>${c.n}</b> — ${c.d}<br>전용 잔향: ${E[c.e][0]} · HP ${c.hp}<br>각성: ${DX[5+i][1]} (${DX[5+i][2]})`,f:()=>start(i)}:{t:'🔒 <b>'+c.n+'</b> — 해금 조건: '+c.u+'<br>전용 잔향: '+E[c.e][0]+' · 각성: '+DX[5+i][1],f:()=>{if(c.cost&&M.g>=c.cost){M.g-=c.cost;M.uc.push(i);sv()}menu(1)}})).concat([{t:'🧪 테스트 모드: '+(TM?'켜짐 (전부 해금 · 저장 안 됨)':'꺼짐'),f:()=>{TM=1-TM;menu()}},...(TM?[{t:'목표 변경: '+GO[RL.goal][0],f:()=>{RL.goal=1-RL.goal;menu(1)}},{t:'규칙 다시 뽑기',f:()=>menu()}]:[]),{t:'💾 저장 백업 / 복원',f:bak},{t:'🏆 도전 과제 ('+M.ac.length+'/'+AC.length+')',f:ach},{t:'📖 도감 ('+M.dx.length+'/'+DX.length+')',f:dex},{t:'⚙ 영구 강화 (재화 '+M.g+')',f:meta},...(M.hd?[{t:'난이도: '+(HD?'Hard':'일반')+' (눌러서 변경)',f:()=>{HD=1-HD;menu(1)}}]:[]),{t:'런 길이: '+TL/60+'분'+(TL==120?' (테스트)':' (기본)')+' (눌러서 변경)',f:()=>{TL=TL==300?120:300;menu(1)}}]))}
function meta(){let N=['최대 HP +8','공격력 +4%','공격 속도 +3%','이동 속도 +3%','치명타 +1%p'];
ask('영구 강화','재화 '+M.g+' (런 종료 시 획득, 사망 시 절반)',N.map((n,i)=>{let c=20+M.u[i]*12;return{t:`${n} · Lv ${M.u[i]} · 비용 ${c}`,f:()=>{if(M.g>=c){M.g-=c;M.u[i]++;sv()}meta()}}}).concat([{t:'뒤로',f:()=>menu(1)}]))}
function bak(){ask('저장 백업','영구 재화·계정 레벨·도감·도전 과제를 코드로 내보내거나 복원합니다. 기기를 바꾸거나 사파리가 데이터를 지울 때를 대비하세요.',[
{t:'백업 코드 보기 · 복사',f:()=>{let c=btoa(unescape(encodeURIComponent(JSON.stringify(M))));try{prompt('아래 코드를 전체 복사해 메모 앱 등에 보관하세요',c)}catch(e){}menu(1)}},
{t:'백업 코드로 복원',f:()=>{try{let c=prompt('백업 코드를 붙여넣으세요');if(c){M=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));M.dx=M.dx||[];M.uc=M.uc||[];M.ac=M.ac||[];M.ax=M.ax||0;sv()}}catch(e){}menu(1)}},
{t:'뒤로',f:()=>menu(1)}])}
const AC=[['first','첫 클리어','런 클리어',30,w=>w],['core3','Core Ⅲ 도달','레벨 10 달성',20,()=>g.lv>=10],['evo','특수 진화','특수 진화 1회',25,()=>g.dc>0],
['sc','특수 Core','특수 Core 진화',40,()=>g.sc],['aw','각성','캐릭터 각성',40,()=>g.aw],['kill','학살자','한 런에 600마리 처치',30,()=>g.k>=600],
['clean','무사 귀환','부활 사용 없이 클리어',50,w=>w&&g.rv>0],['hard','Hard 정복','Hard 클리어',80,w=>w&&HD]];
function ach(){ask('도전 과제','달성하면 영구 재화를 받습니다. (테스트 모드에서는 달성되지 않음)<br><br>'+AC.map(q=>(M.ac.includes(q[0])?'✔ ':'· ')+'<b>'+q[1]+'</b> — '+q[2]+' (+'+q[3]+')').join('<br>'),[{t:'뒤로',f:()=>menu(1)}])}
function dex(){ask('도감','발견하면 영구 보너스(공격력 +1%)가 쌓입니다.<br><br>'+DX.map(r=>{let f=M.dx.includes(r[0]),hd=r[0]=='mirror';return(f?'✔ ':'· ')+'<b>'+(hd&&!f?'???':r[1])+'</b> — '+(hd&&f?'분열Ⅱ + 시간Ⅱ':r[2])}).join('<br>'),[{t:'뒤로',f:()=>menu(1)}])}
function start(i){newG(i);RL.rules.forEach(r=>r.f());if(HD){g.hm*=1.5;g.dx*=1.3;g.es*=1.1;g.sm*=1.25;g.rw*=1.5;g.dr+=.013}if(TL<=120){g.gm*=2.5;g.sm*=1.2}g.eq=shuf([0,1,2,3]).slice(0,2);g.ch=i;g.hint=RL.hint;g.goal=RL.goal;g.st='play'}
function win(){g.won=1;if(!TM){M.hd=1;sv()}ask('목표 달성!','보너스 웨이브: 60초 동안 패널티 없이 완성한 빌드를 마음껏 시험해 보세요.',[{t:'보너스 웨이브 시작',f:()=>{g.bn=60;g.sm=2+g.lv*.12;g.eb=[]}},{t:'결과 보기',f:()=>endRun(1)}])}
function endRun(w,b){g.st='end';if(!TM)try{localStorage.removeItem(RK)}catch(e){}let e=Math.floor((g.t/6+g.k/8)*(w?1:.5)*g.rw)+(b?15:0);let ax=Math.floor(e*1.5)+(w?20:0),L0=AL()[0];let ac=TM?[]:AC.filter(q=>!M.ac.includes(q[0])&&q[4](w));if(!TM){M.g+=e;M.ax+=ax;ac.forEach(q=>{M.ac.push(q[0]);M.g+=q[3]});sv()}let L1=AL()[0],nw=RU.filter(q=>q.u>L0&&q.u<=L1).map(q=>q.n).concat(CH.filter(c=>c.ul>L0&&c.ul<=L1).map(c=>c.n+'(캐릭터)'));ask(w?'런 클리어!':'런 종료',`생존 ${mmss(g.t)} · 처치 ${g.k} · 영구 재화 +${e} · 계정 XP +${ax}${TM?' (테스트 모드 — 저장 안 됨)':''}${L1>L0?'<br>🎉 계정 Lv '+L1+' 달성'+(nw.length?' — 해금: '+nw.join(', '):''):''}${ac.length?'<br>🏆 도전 과제: '+ac.map(q=>q[1]+' (+'+q[3]+')').join(', '):''}<br>Lv ${g.lv} · ${cn()}<br>빌드: ${g.sl.filter(Boolean).map(en).join(' · ')||'-'}`,[{t:'메뉴로',f:()=>{newG(0);menu()}}])}
function hurt(d){if(g.inv>0||g.god)return;g.hp-=d;g.inv=.5;if(g.hp<=0){if(g.bn)endRun(1,1);else if(g.rv>0){g.rv--;g.hp=g.mhp*.6;g.inv=2.5;g.en.forEach(e=>{if(!e.boss&&dist(e,g)<220)e.dead=1});g.eb=[];toast('부활!')}else endRun(0)}}

/* ---------- 잔향 ---------- */
function echoOpt(id){let s=g.sl.find(q=>q&&q.id==id),full=!g.sl.includes(null),lv=s?s.lv:0,n=Math.min(3,lv+1);
let tag=s?(lv<3?`강화 ${RO[lv]}→${RO[lv+1]}`:'최대 단계'):full?'⚠ 교체 (기존 잔향 초기화)':'새로 장착';
let hint=RC.filter(r=>r.includes(id)).map(rc=>{let hd=rc[2]=='mirror'&&!M.dx.includes('mirror');return`<br><i>특수 진화: ${hd?'???':E[rc[2]][0]} (${E[rc[0]][0]}+${hd?'?':E[rc[1]][0]} Ⅱ↑) 현재 ${rc.slice(0,2).filter(a=>g.sl.some(q=>q&&q.id==a&&q.lv>1)).length}/2</i>`}).join('');
return{t:`<b style="color:${E[id][1]}">${E[id][0]} ${RO[n]}</b> · ${tag}<br>${E[id][1+n]}${hint}`,f:()=>give(id)}}
function offer(){let c=[],w=i=>(i==g.hint?2:1)*(g.sl.some(s=>s&&s.id==i)?1.4:1);
while(c.length<3){let p=ids.filter(i=>!c.includes(i)),t=p.reduce((a,i)=>a+w(i),0)*R();for(const i of p){t-=w(i);if(t<=0){c.push(i);break}}}
ask('잔향 선택','하나를 가져갑니다. 시너지는 카드에서 확인하세요.',c.map(echoOpt).concat([{t:'넘기기 — 현재 잔향 유지',f:()=>{}}]))}
function give(id,auto){let s=g.sl.find(q=>q&&q.id==id);
if(s){if(s.lv<3&&!s.done){s.lv++;toast(E[id][0]+' '+RO[s.lv])}evo();return}

X.globalCompositeOperation='lighter';

else{let k=1-Math.min(1,f.t/.3);if(!f.ring){X.globalAlpha=.4*(1-k);X.fillStyle=f.c;X.beginPath();X.arc(f.x,f.y,f.r*(.5+.5*k),0,TAU);X.fill()}X.globalAlpha=1-k;X.strokeStyle=f.c;X.lineWidth=3;X.beginPath();X.arc(f.x,f.y,f.r*(.4+.6*k),0,TAU);X.stroke()}}
X.globalAlpha=1;X.globalCompositeOperation='source-over';

const w0=W,h0=H;X.save();X.scale(U,U);W/=U;H/=U;
bar(12,12,MOB?80:160,10,g.hp/g.mhp,'#ff4d6d');bar(0,H-5,W,5,g.xp/g.need,'#8b7bff');
X.strokeStyle='#ffffff77';X.lineWidth=2;X.strokeRect(W-36,8,26,26);X.fillStyle='#e8e8f4';X.fillRect(W-29,15,4,12);X.fillRect(W-21,15,4,12);
X.fillStyle='#e8e8f4';X.font='12px system-ui,sans-serif';X.textAlign='left';
X.fillText(`HP ${Math.ceil(g.hp)}/${Math.ceil(g.mhp)}  Lv ${g.lv}  부활 ${g.rv}  재화 ${g.gold|0}${TM?' · TEST'+(g.god?' · 무적':''):''}`,12,38);
X.textAlign='center';X.fillText(g.bn?'보너스 웨이브 '+Math.ceil(g.bn)+'초':g.boss?'BOSS':g.fin?'생존 '+Math.ceil(TL+40-g.t)+'초':mmss(Math.max(0,TL-g.t))+' → '+GO[g.goal][0],W/2,18);

g.sl.forEach((q,i)=>{let a=W/2-90+i*36,b=H-50;X.strokeStyle=q?E[q.id][1]:'#444';X.lineWidth=2;X.strokeRect(a,b,32,36);
if(q){X.fillStyle=E[q.id][1];X.font='bold 14px system-ui,sans-serif';X.fillText(E[q.id][0][0],a+16,b+16);X.font='11px system-ui,sans-serif';X.fillText(q.done?'★':RO[q.lv]+(q.lock?'·':''),a+16,b+31)}});
if(g.toast){X.globalAlpha=Math.min(1,g.toast[1]);X.fillStyle='#fff';X.font='bold 18px system-ui,sans-serif';X.fillText(g.toast[0],W/2,90);X.globalAlpha=1}

if(jo&&tv){X.strokeStyle='#ffffff55';X.lineWidth=2;X.beginPath();X.arc(jo.x,jo.y,50,0,TAU);X.stroke();X.fillStyle='#ffffff44';X.beginPath();X.arc(jo.x+tv.x*50,jo.y+tv.y*50,18,0,TAU);X.fill()}}
